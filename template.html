<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Lavesta - Trang Sức Bạc Cao Cấp</title>
    <link rel="shortcut icon" href="images/logo.png" type="image/png" />
    <link rel="stylesheet" href="template.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-2.2.4.js"
      integrity="sha256-iT6Q9iMJYuQiMWNd9lDyBUStIq/8PuOW33aOqmvFpqI="
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="">
    <div>
      <script>
        $(document).ready(function () {
          /*Khi nguoi dung lick vao se hien thi/thu lai thanh navigation-bar */
          $(".header__toggle").click(function () {
            $(".header__nav").slideToggle();
          });
        });
      </script>
      <header class="header">
        <div class="header__inner">
          <div class="header__left">
            <button class="header__toggle">
              <i class="fas fa-bars"></i>
            </button>
            <a href="" class="header__logo">
              <img class="logo__image" src="images/logo.png" alt="Logo" />
            </a>
          </div>
          <div class="header__search">
            <input
              type="text"
              class="header__search-input"
              placeholder="Tìm kiếm"
            />
          </div>
          <div class="header__actions">
            <button class="header__btn header__btn--login">Tài khoản</button>
            <button class="header__btn header__btn--cart">
              <i class="fas fa-shopping-cart"></i> Giỏ hàng
            </button>
          </div>
        </div>
        <nav class="header__nav">
          <ul class="header__menu">
            <li><a href="">Trang chủ</a></li>
            <li><a href="">Sản Phẩm</a></li>
            <li><a href="">Giới thiệu</a></li>
            <li><a href="">Về chúng tôi</a></li>
            <li><a href="">Hướng dẫn</a></li>
          </ul>
        </nav>
      </header>
      <!-- Bạn có thể thay đổi đường dẫn ảnh trong file CSS cho banner này -->
      <div id="banner"></div>
    </div>

    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__left">
          <a href="" class="footer__logo">
            <img class="logo__image" src="images/logo.png" alt="Logo" />
          </a>
        </div>
        <div class="footer__content">
          <div class="footer__section">
            <h3>Giới thiệu</h3>
            <a href="">Về Lavesta</a>
            <a href="">Hệ thống cửa hàng</a>
          </div>
          <div class="footer__section">
            <h3>Chính Sách</h3>
            <a href="">Chính sách bảo mật</a>
            <a href="">Chính sách bảo hành</a>
          </div>
          <div class="footer__section">
            <h3>Theo dõi và liên lạc</h3>
            <a href=""><i class="fab fa-facebook-square"></i> Facebook</a>
            <a href=""><i class="fab fa-instagram"></i> Instagram</a>
          </div>
        </div>
        <div class="footer__bottom">
          <p>&copy; 2026 <a href="">Lavesta. Group 6</a></p>
        </div>
      </div>
    </footer>
  </body>
</html>
