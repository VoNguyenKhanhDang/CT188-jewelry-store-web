<div id="header-placeholder"></div>
    <!-- Phần main của trang giỏ hàng -->
    <main class="Cart-container">
        <H1>GIỎ HÀNG CỦA BẠN</H1>
     <section class="Cart__section">

        <h2>Các <span>sản phẩm</span> trong giỏ hàng</h2>
       <!-- bắt đầu sinh vật phẩm từ đây -->
      
        
        
        <!-- kết thúc sinh sản phẩm ở đây -->
        <div class="form-details">
         <form class="Cart__form">
            <h2>Ghi chú đơn hàng:</h2>
             <textarea id="text__supmit"></textarea>
         </form>
        </div>
     </article>
       <!-- phần sidebar -->
      <div class="Cart__sidebar">
       <h2>Thông tin đơn hàng</h2>
        <div class="sPrice">
           <p>Tổng tiền: </p>
          <p class="price">0đ</p>
        </div>
          <button class="buying__button">XÁC NHẬN ĐƠN HÀNG</button>
      </div>
     </section>

    </main>
    <div id="footer-placeholder"></div>
